# RigControl Web — headless deployment (no Electron/GUI).
# See docs/headless-deployment.md for the full setup guide, including why
# host networking is required (Hamlib UDP multicast spectrum reception) and
# how serial/audio/FT4222 device access works.
#
# Quick start:
#   1. Find your radio's stable serial device path:
#        ls -l /dev/serial/by-id/
#      and replace the placeholder below.
#   2. Find this host's actual dialout/audio GIDs (these vary by distro —
#      do NOT assume the values below; confirmed on a real Ubuntu 24.04
#      test host that they differ from the image's baked-in defaults):
#        getent group dialout audio | awk -F: '{print $1"_GID="$3}'
#      Export them (or put them in a .env file next to this compose file)
#      before running:
#        export DIALOUT_GID=<value> AUDIO_GID=<value>
#   3. docker compose up -d
#   4. Log in at https://<this-host>:3000 as ADMIN/admin (forced password
#      change on first login).

services:
  rigcontrol-web:
    image: jbdubbs/rigcontrol-web:latest
    container_name: rigcontrol-web
    restart: unless-stopped

    # Required for the Hamlib UDP multicast spectrum source to receive
    # traffic at all — Docker's default bridge network NATs the container
    # behind a virtual interface that LAN multicast doesn't reach. Loses
    # Docker's port isolation, which is irrelevant on a dedicated
    # controller box.
    network_mode: host

    # Non-root container user (see Dockerfile) needs these host groups to
    # reach the bind-mounted device nodes below. IMPORTANT: --group-add
    # resolves group *names* against /etc/group inside the image, not the
    # host — the image (built from ubuntu:24.04) bakes in dialout=20,
    # audio=29, but real hosts commonly differ (confirmed on a real test
    # host: dialout=18, audio=63 — using the names here silently granted
    # the WRONG groups and device access failed). Numeric host GIDs (set
    # via DIALOUT_GID/AUDIO_GID above) are the only portable fix. See
    # docs/headless-deployment.md for the rootless-container caveat if
    # you're running Docker/Podman rootless.
    group_add:
      - "${DIALOUT_GID:?Set DIALOUT_GID — see the Quick start comment above}"
      - "${AUDIO_GID:?Set AUDIO_GID — see the Quick start comment above}"

    devices:
      # CAT control serial port. Prefer the stable /dev/serial/by-id/...
      # path over /dev/ttyUSB0, which can shift across reboots/replugs.
      - /dev/serial/by-id/<your-device-path>:/dev/ttyUSB0
      # Radio's USB audio interface (whole ALSA subsystem — the exact
      # card index isn't stable either).
      - /dev/snd:/dev/snd

    # FT-710 spectrum scope (FT4222 USB-SPI) needs raw USB bus access,
    # which is harder to pin reliably in Docker (bus/device numbers
    # renumber on replug). If you need it, uncomment below — you'll also
    # still need the host udev rule from docs/ft4222-spectrum-setup.md,
    # since that governs access even through a bind mount. Otherwise, the
    # systemd deployment path (docs/headless-deployment.md) is recommended
    # for FT4222 users.
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # device_cgroup_rules:
    #   - "c 189:* rmw"

    environment:
      RCW_DATA_DIR: /data

    volumes:
      - rcw-data:/data

volumes:
  rcw-data:
