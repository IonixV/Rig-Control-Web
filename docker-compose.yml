# RigControl Web — headless deployment (no Electron/GUI).
# Full guide: https://github.com/jbdubbs/Rig-Control-Web/wiki/Headless-Deployment
# FT4222 (FT-710 spectrum scope) setup: https://github.com/jbdubbs/Rig-Control-Web/wiki/Spectrum-Scope-FT-710

services:
  rigcontrol-web:
    image: jbdubbs/rigcontrol-web:latest
    container_name: rigcontrol-web
    restart: unless-stopped

    network_mode: host # required for Hamlib UDP multicast spectrum reception

    group_add: # numeric host GIDs, not names — see wiki
      - "${DIALOUT_GID:?Set DIALOUT_GID — see wiki}"
      - "${AUDIO_GID:?Set AUDIO_GID — see wiki}"

    security_opt: # required alongside /dev/snd below for audio device enumeration
      - systempaths=unconfined

    devices:
      - /dev/serial/by-id/<your-device-path>:/dev/ttyUSB0 # CAT control
      - /dev/snd:/dev/snd # radio's USB audio interface
      # - /dev/serial/by-id/<your-cw-keyer-device-path>:/dev/ttyUSB1 # CW keying, separate port
      # - /dev/bus/usb:/dev/bus/usb # FT4222

    # device_cgroup_rules: # FT4222
    #   - "c 189:* rmw"

    environment:
      RCW_DATA_DIR: /data
      # LD_LIBRARY_PATH: /usr/local/lib # FT4222

    volumes:
      - rcw-data:/data
      # - /usr/local/lib:/usr/local/lib:ro # FT4222: bind-mount host libft4222

volumes:
  rcw-data:
