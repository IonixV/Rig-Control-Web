name: Publish Docker Image

# Builds and publishes the headless (no Electron/GUI) deployment image from
# ./Dockerfile to Docker Hub. Independent of build.yml's Electron installer
# matrix — this image reuses the already-committed, glibc-2.39-floor-checked
# bin/linux/* binaries directly rather than rebuilding them.
#
# Stage 1 (current): linux/amd64 only. ARM64 (Raspberry Pi) is a planned
# follow-up — see docs/headless-deployment.md.
#
# Requires two repo secrets that must be created once before this workflow
# can run: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not the account password — create one at
# https://hub.docker.com/settings/security).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image tags
        id: tags
        run: |
          IMAGE=jbdubbs/rigcontrol-web
          TAGS="$IMAGE:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,$IMAGE:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
