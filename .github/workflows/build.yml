name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: linux, win, mac (or all)'
        required: false
        default: 'all'

# Required for softprops/action-gh-release to create a release and upload assets
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      all_platforms: ${{ steps.set-matrix.outputs.all_platforms }}
    steps:
      - id: set-matrix
        run: |
          P="${{ github.event.inputs.platforms }}"
          if [ -z "$P" ]; then P="all"; fi
          ITEMS=()
          # Pinned to ubuntu-24.04 (not ubuntu-latest) — this project's
          # documented Linux floor. The CW/FT4222/WSJTX-bridge helpers below
          # compile fresh here on every release, and if bin/linux/rigctld
          # is ever missing and has to build fresh too, all of them need to
          # target this floor's glibc rather than whatever Ubuntu "latest"
          # rolls to, or they won't run on the oldest supported distro.
          if [ "$P" = "all" ] || [[ "$P" == *"linux"* ]]; then
            ITEMS+=('{"os":"ubuntu-24.04","platform":"linux","artifact":"linux"}')
          fi
          if [ "$P" = "all" ] || [[ "$P" == *"win"* ]]; then
            ITEMS+=('{"os":"windows-2022","platform":"win","artifact":"*.exe"}')
          fi
          if [ "$P" = "all" ] || [[ "$P" == *"mac"* ]]; then
            ITEMS+=('{"os":"macos-latest","platform":"mac","artifact":"*.dmg"}')
          fi
          JOINED=$(IFS=,; echo "${ITEMS[*]}")
          echo "matrix={\"include\":[$JOINED]}" >> $GITHUB_OUTPUT
          # Flag whether all three platforms are being built
          if [ "$P" = "all" ]; then
            echo "all_platforms=true" >> $GITHUB_OUTPUT
          else
            echo "all_platforms=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # naudiodon requires ALSA headers on Linux.
      # libopus-dev provides Opus headers if libopus-node compiles from source.
      # rpm provides rpmbuild, required by electron-builder's fpm for RPM generation.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev rpm

      # npm ci uses package-lock.json for a clean, reproducible install.
      # The postinstall script (electron-builder install-app-deps) automatically
      # rebuilds native modules (naudiodon, libopus-node) for the Electron ABI
      # on the current platform.
      - name: Install dependencies
        run: npm ci

      - name: Compile CW key helper (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: gcc -O2 -o bin/linux/cw-key-helper cw-key-helper.c

      - name: Compile FT4222 scope reader (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: gcc -O2 -o bin/linux/ft4222-scope-reader ft4222-scope-reader.c -ldl

      - name: Compile WSJTX bridge helper (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: gcc -O2 -o bin/linux/wsjtx-bridge wsjtx-bridge.c

      - name: Compile CW key helper (macOS)
        if: matrix.os == 'macos-latest'
        run: clang -O2 -o bin/mac/cw-key-helper cw-key-helper.c

      - name: Compile FT4222 scope reader (macOS)
        if: matrix.os == 'macos-latest'
        run: clang -O2 -o bin/mac/ft4222-scope-reader ft4222-scope-reader.c

      - name: Compile WSJTX bridge helper (macOS)
        if: matrix.os == 'macos-latest'
        run: clang -O2 -o bin/mac/wsjtx-bridge wsjtx-bridge.c

      - name: Set up MSVC (Windows)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile CW key helper (Windows)
        if: matrix.os == 'windows-2022'
        shell: cmd
        run: cl cw-key-helper.c /Fe:bin\windows\cw-key-helper.exe /O2 /nologo

      - name: Compile FT4222 scope reader (Windows)
        if: matrix.os == 'windows-2022'
        shell: cmd
        run: cl ft4222-scope-reader.c /Fe:bin\windows\ft4222-scope-reader.exe /O2 /nologo

      - name: Compile WSJTX bridge helper (Windows)
        if: matrix.os == 'windows-2022'
        shell: cmd
        run: cl wsjtx-bridge.c /Fe:bin\windows\wsjtx-bridge.exe /O2 /nologo ws2_32.lib advapi32.lib

      - name: Build rigctld (Linux/macOS)
        if: matrix.os != 'windows-2022'
        env:
          HAMLIB_RCW_TOKEN: ${{ secrets.HAMLIB_RCW_TOKEN }}
        run: node scripts/build-rigctld.mjs

      # The committed bin/linux/rigctld is normally reused as-is by the step
      # above (it only builds from source if the binary is missing) — this
      # catches the case where it was rebuilt on a machine with a newer
      # glibc than this project's floor (Ubuntu 24.04, glibc 2.39) and
      # re-committed without checking, which would otherwise ship a rigctld
      # that fails to run for anyone on the documented minimum-supported
      # distro. This exact mistake happened once already.
      - name: Verify bin/linux/rigctld's glibc floor
        if: matrix.os == 'ubuntu-24.04'
        run: |
          MAX_GLIBC=$(objdump -T bin/linux/rigctld | grep -oP 'GLIBC_\K[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "bin/linux/rigctld requires glibc <= $MAX_GLIBC"
          MAJOR=$(echo "$MAX_GLIBC" | cut -d. -f1)
          MINOR=$(echo "$MAX_GLIBC" | cut -d. -f2)
          if [ "$MAJOR" -gt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -gt 39 ]; }; then
            echo "::error::bin/linux/rigctld requires glibc $MAX_GLIBC, newer than this project's floor (Ubuntu 24.04, glibc 2.39). Rebuild it in an 'ubuntu:24.04' container (see scripts/build-rigctld.mjs) before committing."
            exit 1
          fi

      - name: Check rigctld binary (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          if (Test-Path "bin\windows\rigctld.exe") {
            Write-Host "[rigctld] Binary already exists at bin\windows\rigctld.exe — skipping build."
            echo "RIGCTLD_EXISTS=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "[rigctld] Binary not found — will build via MSYS2."
            echo "RIGCTLD_EXISTS=false" >> $env:GITHUB_ENV
          }

      - name: Set up MSYS2 for rigctld build (Windows)
        if: matrix.os == 'windows-2022' && env.RIGCTLD_EXISTS != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            autoconf
            automake
            libtool
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-readline

      - name: Build rigctld (Windows MSYS2)
        if: matrix.os == 'windows-2022' && env.RIGCTLD_EXISTS != 'true'
        shell: msys2 {0}
        env:
          HAMLIB_RCW_TOKEN: ${{ secrets.HAMLIB_RCW_TOKEN }}
        run: |
          set -e
          # jbdubbs/hamlib-RCW, not vanilla Hamlib — see scripts/build-rigctld.mjs
          # for why. Private repo, so the clone needs an authenticated URL in CI.
          git clone --depth=1 "https://x-access-token:${HAMLIB_RCW_TOKEN}@github.com/jbdubbs/hamlib-RCW.git" hamlib-src
          cd hamlib-src
          autoreconf -fi
          ./configure --disable-shared --enable-static --without-tcl --without-cxx-binding LDFLAGS="-static-libgcc -static-libstdc++"
          make -j$(nproc)
          mkdir -p ../bin/windows
          BIN=""
          for CANDIDATE in tests/rigctld.exe tests/.libs/rigctld.exe src/rigctld.exe src/.libs/rigctld.exe; do
            [ -f "$CANDIDATE" ] && BIN="$CANDIDATE" && break
          done
          [ -n "$BIN" ] || { echo "[rigctld] Binary not found after build"; exit 1; }
          cp "$BIN" ../bin/windows/rigctld.exe
          # Bundle all MINGW64 runtime DLLs that rigctld.exe depends on
          ldd "$BIN" | grep '/mingw64/bin/' | awk '{print $3}' | xargs -I{} cp {} ../bin/windows/
          cd ..
          rm -rf hamlib-src

      # --publish never prevents electron-builder from trying to upload to GitHub
      # Releases itself (it lacks a token). The next two steps handle publishing.
      - name: Build
        run: npm run electron:build -- --${{ matrix.platform }} ${{ matrix.platform == 'mac' && '--arm64' || '' }} --publish never

      # Collect build artifacts into a staging directory for upload.
      # Linux produces AppImage + deb + rpm; other platforms produce a single installer.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p build/artifacts
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp build/*.AppImage build/*.deb build/*.rpm build/artifacts/ 2>/dev/null || true
          else
            cp build/${{ matrix.artifact }} build/artifacts/ 2>/dev/null || true
          fi
          ls -lh build/artifacts/

      # Upload as a workflow artifact (useful for inspecting builds without a release)
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rigcontrol-web-${{ matrix.platform }}
          path: build/artifacts/*

      # Stage the standalone WSJTX bridge helper with a platform-specific name
      # so all three can be downloaded from the GitHub Pages /downloads/ page.
      - name: Stage WSJTX bridge helper
        shell: bash
        run: |
          mkdir -p build/wsjtx-bridge
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp bin/linux/wsjtx-bridge build/wsjtx-bridge/wsjtx-bridge-linux
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            cp bin/mac/wsjtx-bridge build/wsjtx-bridge/wsjtx-bridge-mac
          elif [ "${{ matrix.platform }}" = "win" ]; then
            cp bin/windows/wsjtx-bridge.exe build/wsjtx-bridge/wsjtx-bridge.exe
          fi

      - name: Upload WSJTX bridge helper
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-bridge-${{ matrix.platform }}
          path: build/wsjtx-bridge/*

      # Attach the installer to the GitHub Release — only runs on tag pushes, not manual dispatches
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After all platforms build, copy the WSJTX bridge helper binaries into
  # docs/downloads/ so they're served by GitHub Pages.  Only runs when all
  # three platforms were built (tag push or workflow_dispatch with "all").
  publish-helper:
    needs: [prepare, build]
    if: needs.prepare.outputs.all_platforms == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download WSJTX bridge artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wsjtx-bridge-*
          path: docs/downloads/
          merge-multiple: true

      - name: Verify all platform binaries present
        run: |
          echo "Contents of docs/downloads/:"
          ls -lh docs/downloads/
          for f in wsjtx-bridge-linux wsjtx-bridge-mac wsjtx-bridge.exe; do
            if [ ! -f "docs/downloads/$f" ]; then
              echo "ERROR: Missing docs/downloads/$f"
              exit 1
            fi
          done
          echo "All three platform binaries present."

      - name: Commit and push helper binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/wsjtx-bridge-linux docs/downloads/wsjtx-bridge-mac docs/downloads/wsjtx-bridge.exe
          if git diff --cached --quiet; then
            echo "No changes to helper binaries — skipping commit."
          else
            git commit -m "ci: update WSJTX bridge helper binaries for GitHub Pages"
            git push
          fi

  # Deploys docs/ to GitHub Pages. Deliberately a job in *this* workflow
  # (release tag push or workflow_dispatch "all") rather than a separate
  # pages.yml triggered on push to main — Pages is configured with
  # build_type "workflow" (not the legacy "deploy from a branch" mode, which
  # auto-rebuilds on every push with no way to scope it), and chaining off
  # publish-helper specifically means this job checks out main *after*
  # publish-helper's commit, so the deployed site always includes that
  # release's freshly-built wsjtx-bridge download binaries rather than
  # whatever was on main before the release ran.
  deploy-pages:
    needs: [prepare, publish-helper]
    if: needs.prepare.outputs.all_platforms == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (post publish-helper commit)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
